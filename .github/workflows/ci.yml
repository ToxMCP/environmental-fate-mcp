name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Generate artifacts
        run: uv run fate-mcp-generate-artifacts
      - name: Build public release bundle
        run: uv run environmental-fate-mcp-build-release-bundle
      - name: Ensure artifacts are up to date
        run: |
          git diff --exit-code || (
            echo "::error::Generated artifacts or release bundle files are out of date. Run 'uv run fate-mcp-generate-artifacts' and 'uv run environmental-fate-mcp-build-release-bundle' and commit the changes." &&
            exit 1
          )
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Run tests
        run: uv run --extra dev pytest
      - name: Run release validator
        run: uv run environmental-fate-mcp-validate
      - name: Smoke startup validation
        run: uv run python -c "from fate_mcp.server import create_server; create_server()"
      - name: Build package
        run: uv build
      - name: Smoke installed wheel
        run: |
          tmpdir="$(mktemp -d)"
          uv venv --python 3.12 "$tmpdir/venv"
          uv pip install --python "$tmpdir/venv/bin/python" dist/*.whl
          "$tmpdir/venv/bin/python" - <<'PY'
          import asyncio
          import json
          from fate_mcp.server import create_server, _resolve_external_payload_path

          async def main() -> None:
              server = create_server()
              tools = await server.list_tools()
              assert len(tools) == 60
              assert len(await server.list_prompts()) == 22
              assert len(await server.list_resources()) == 32
              assert all(tool.annotations is not None for tool in tools)
              assert all(tool.outputSchema is not None for tool in tools)
              metadata_contents = await server.read_resource("release://metadata-report")
              metadata = json.loads(metadata_contents[0].content)
              assert metadata["toolCount"] == 60
              assert metadata["promptCount"] == 22
              assert metadata["resourceCount"] == 32
              fugacity = json.loads((await server.read_resource("defaults://fugacity-screening-method-profiles"))[0].content)
              assert fugacity["profile_count"] == 2
              demo_pack = await server.read_resource("defaults://erosion-sediment-validation-demo-pack")
              assert "synthetic" in demo_pack[0].content.lower()
              benchmark_pack = await server.read_resource("defaults://scientific-external-benchmark-pack")
              assert json.loads(benchmark_pack[0].content)["case_count"] == 8
              sensitivity_profiles = await server.read_resource("defaults://default-sensitivity-profiles")
              assert json.loads(sensitivity_profiles[0].content)["profile_count"] == 11
              evidence_rubric = await server.read_resource("defaults://scientific-evidence-quality-rubric")
              assert json.loads(evidence_rubric[0].content)["tier_count"] == 5
              evidence_matrix = await server.read_resource("release://scientific-evidence-quality-matrix-report")
              assert json.loads(evidence_matrix[0].content)["passed"] is True
              fixture_path = _resolve_external_payload_path(
                  "config/adapter-fixtures/illustrative_external_engine_payload.json"
              )
              assert fixture_path.name == "illustrative_external_engine_payload.json"

          asyncio.run(main())
          PY
