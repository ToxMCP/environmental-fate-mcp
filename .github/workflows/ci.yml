name: CI

on:
  push:
  pull_request:

env:
  SOURCE_DATE_EPOCH: "1790884800"

jobs:
  validate-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --frozen --extra dev
      - name: Generate artifacts
        run: uv run fate-mcp-generate-artifacts
      - name: Build public release bundle
        run: uv run environmental-fate-mcp-build-release-bundle
      - name: Ensure artifacts are up to date
        run: |
          git diff --exit-code || (
            echo "::error::Generated artifacts or release bundle files are out of date. Run 'uv run fate-mcp-generate-artifacts' and 'uv run environmental-fate-mcp-build-release-bundle' and commit the changes." &&
            exit 1
          )
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Run tests
        run: uv run --extra dev pytest
      - name: Run release validator
        run: uv run environmental-fate-mcp-validate
      - name: Smoke startup validation
        run: uv run python -c "from fate_mcp.server import create_server; create_server()"
      - name: Build package
        run: uv build
      - name: Smoke installed wheel
        run: |
          tmpdir="$(mktemp -d)"
          uv venv --python 3.12 "$tmpdir/venv"
          uv pip install --python "$tmpdir/venv/bin/python" dist/*.whl
          "$tmpdir/venv/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          import tempfile
          from importlib.metadata import distribution

          os.chdir(tempfile.mkdtemp(prefix="fate-installed-wheel-"))
          entries = [entry for entry in distribution("environmental-fate-mcp").entry_points if entry.group == "console_scripts"]
          assert len(entries) == 10
          for entry in entries:
              assert callable(entry.load()), entry.name

          from fate_mcp.server import create_server, _resolve_external_payload_path

          async def main() -> None:
              server = create_server()
              tools = await server.list_tools()
              assert len(tools) == 60
              assert len(await server.list_prompts()) == 22
              assert len(await server.list_resources()) == 32
              assert all(tool.annotations is not None for tool in tools)
              assert all(tool.output_schema is not None for tool in tools)
              metadata_contents = await server.read_resource("release://metadata-report")
              metadata = json.loads(metadata_contents[0].content)
              assert metadata["toolCount"] == 60
              assert metadata["promptCount"] == 22
              assert metadata["resourceCount"] == 32
              fugacity = json.loads((await server.read_resource("defaults://fugacity-screening-method-profiles"))[0].content)
              assert fugacity["profile_count"] == 2
              demo_pack = await server.read_resource("defaults://erosion-sediment-validation-demo-pack")
              assert "synthetic" in demo_pack[0].content.lower()
              benchmark_pack = await server.read_resource("defaults://scientific-external-benchmark-pack")
              assert json.loads(benchmark_pack[0].content)["case_count"] == 8
              sensitivity_profiles = await server.read_resource("defaults://default-sensitivity-profiles")
              assert json.loads(sensitivity_profiles[0].content)["profile_count"] == 11
              evidence_rubric = await server.read_resource("defaults://scientific-evidence-quality-rubric")
              assert json.loads(evidence_rubric[0].content)["tier_count"] == 5
              evidence_matrix = await server.read_resource("release://scientific-evidence-quality-matrix-report")
              assert json.loads(evidence_matrix[0].content)["passed"] is True
              fixture_path = _resolve_external_payload_path(
                  "config/adapter-fixtures/illustrative_external_engine_payload.json"
              )
              assert fixture_path.name == "illustrative_external_engine_payload.json"

          asyncio.run(main())
          PY

  protocol-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sync SDK2 server and isolated SDK1 client
        run: |
          uv sync --extra dev --locked
          uv sync --project tests/compatibility/legacy-client --locked
      - name: Build and install frozen wheel outside checkout
        run: |
          uv build --wheel
          uv export --frozen --no-dev --no-default-groups --no-emit-project --output-file /tmp/fate-runtime.txt
          uv venv .protocol-runtime
          uv pip install --no-config --python .protocol-runtime/bin/python --require-hashes -r /tmp/fate-runtime.txt
          uv pip install --no-config --python .protocol-runtime/bin/python --no-deps dist/*.whl
          uv pip check --python .protocol-runtime/bin/python
      - name: Real SDK1 and SDK2 clients over stdio/HTTP plus legacy SSE
        run: |
          uv run python scripts/verify_protocol_clients.py \
            --server-python "$PWD/.protocol-runtime/bin/python" \
            --legacy-python "$PWD/tests/compatibility/legacy-client/.venv/bin/python" \
            --modern-python "$PWD/.venv/bin/python" \
            --output-dir /tmp/fate-protocol-results
      - name: Audit isolated compatibility client
        run: |
          uv export --project tests/compatibility/legacy-client --frozen --no-emit-project --no-hashes --output-file /tmp/fate-legacy-client.txt
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r /tmp/fate-legacy-client.txt


  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build -t environmental-fate-mcp:sdk2 .
      - name: Validate installed runtime and packaged defaults
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python environmental-fate-mcp:sdk2 -c "from fate_mcp.server import create_server; from fate_mcp.benchmarks import benchmark_manifest; create_server(); assert benchmark_manifest()['scientificValidationClaimCoverage']['uncovered_mandatory_claim_count'] == 0"
      - name: Verify the HTTP gateway guard fails closed
        run: |
          if docker run --rm environmental-fate-mcp:sdk2 > /tmp/fate-guard.log 2>&1; then
            echo "::error::The HTTP entrypoint started without the required gateway opt-in."
            exit 1
          fi
          grep -q "Refusing to start unauthenticated" /tmp/fate-guard.log

  validate:
    name: validate
    if: always()
    needs: [validate-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation matrix job to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validate-matrix.result }}
        run: test "$VALIDATION_RESULT" = "success"
