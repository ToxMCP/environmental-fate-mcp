name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install project and security tools
        run: |
          uv sync --all-extras --dev || uv sync --dev
          uv pip install bandit pip-audit cyclonedx-bom
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Bandit
        run: uv run bandit -r src -x tests
      - name: pip-audit
        run: uv run pip-audit --desc
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          uv run cyclonedx-py environment --output-format JSON --output-file artifacts/python-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: artifacts/python-sbom.cdx.json
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose
