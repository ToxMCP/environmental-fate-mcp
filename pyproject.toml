[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "environmental-fate-mcp"
version = "0.5.0"
description = "Environmental Fate MCP for auditable environmental release-to-concentration workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ToxMCP" }]
dependencies = [
  "mcp[cli]>=1.28.1,<2.0.0",
  "pydantic>=2.8,<3.0",
  "python-multipart>=0.0.26",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
environmental-fate-mcp = "fate_mcp.__main__:main"
environmental-fate-mcp-http = "fate_mcp.transport.http:main"
environmental-fate-mcp-generate-artifacts = "fate_mcp.contracts:main"
environmental-fate-mcp-validate = "fate_mcp.validation:main"
environmental-fate-mcp-build-release-bundle = "fate_mcp.release_artifacts:main"
fate-mcp = "fate_mcp.__main__:main"
fate-mcp-http = "fate_mcp.transport.http:main"
fate-mcp-generate-artifacts = "fate_mcp.contracts:main"
fate-mcp-validate = "fate_mcp.validation:main"
fate-mcp-build-release-bundle = "fate_mcp.release_artifacts:main"

# Force the transitive pydantic-settings (pulled via mcp[cli]) to the patched
# release that fixes GHSA-4xgf-cpjx-pc3j (2.14.1 is vulnerable; 2.14.2 is fixed).
[tool.uv]
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fate_mcp = ["package_data/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
